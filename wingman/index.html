<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman</title>
<style>
  :root { --bone: #e0e2e6; --bone-hi: #f5f7fa; --amber: #f5c542; --muted: #6b7280; }
  * { box-sizing: border-box; }
  ::selection { background: rgba(245,197,66,0.30); color: #fffaf0; }   /* amber highlight, on-theme */
  html, body { margin: 0; height: 100%; background: #060709; color: var(--bone);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }

  /* param panel */
  .studio-panel { position: absolute; top: 14px; right: 14px; width: 290px; max-height: calc(100% - 130px);
    overflow: auto; background: rgba(10,11,16,0.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(245,197,66,0.16); border-radius: 12px; padding: 8px; }
  .studio-group { border-bottom: 1px solid rgba(255,255,255,0.05); }
  .studio-grouphead { text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px; color: var(--amber);
    padding: 9px 8px 6px; cursor: pointer; user-select: none; }
  .studio-grouphead::before { content: "▾ "; color: var(--muted); }
  .studio-group.collapsed .studio-groupbody { display: none; }
  .studio-group.collapsed .studio-grouphead::before { content: "▸ "; }
  .studio-groupbody { padding: 0 8px 8px; }
  .studio-row { display: grid; grid-template-columns: 1fr; gap: 3px; margin: 7px 0; }
  .studio-row label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .studio-val { color: var(--bone); font-variant-numeric: tabular-nums; }
  .studio-row input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    background: rgba(245,197,66,0.22); border-radius: 3px; outline: none; }
  .studio-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--amber); cursor: pointer; box-shadow: 0 0 8px rgba(245,197,66,0.6); }
  .studio-row input[type=checkbox] { accent-color: var(--amber); justify-self: start; }

  /* transport */
  .studio-barwrap { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(70vw, 760px); z-index: 8;
    transition: opacity .3s ease, transform .3s ease; }
  .studio-barwrap.hidden { display: block !important; opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(18px); }
  .studio-toggle { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 34px; height: 4px;
    border-radius: 3px; border: 0; padding: 0; cursor: pointer; z-index: 9; background: rgba(245,197,66,0.16); transition: background .25s; }
  .studio-toggle:hover { background: rgba(245,197,66,0.55); }
  #galleryBtn { display: none;   /* dev-only; revealed by the ?dev boot path so it never flashes for visitors */
    position: absolute; left: 14px; bottom: 12px; z-index: 9; appearance: none; cursor: pointer;
    background: rgba(10,11,16,0.7); border: 1px solid rgba(245,197,66,0.18); color: var(--muted); font: inherit;
    font-size: 11px; letter-spacing: 0.08em; padding: 7px 12px; border-radius: 8px; opacity: 0.45; transition: opacity .25s, color .25s; }
  #galleryBtn:hover { opacity: 1; color: var(--bone); }
  .studio-bar { display: flex; align-items: center; gap: 12px; background: rgba(10,11,16,0.82);
    backdrop-filter: blur(10px); border: 1px solid rgba(245,197,66,0.16); border-radius: 10px; padding: 9px 14px; }
  .studio-play { appearance: none; border: 0; background: none; color: var(--bone); cursor: pointer; font-size: 13px;
    width: 22px; height: 22px; display: grid; place-items: center; padding: 0; }
  .studio-play:hover { color: var(--bone-hi); }
  .studio-scrub { -webkit-appearance: none; appearance: none; flex: 1; height: 3px; background: rgba(245,197,66,0.25);
    border-radius: 3px; outline: none; }
  .studio-scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--amber); cursor: pointer; box-shadow: 0 0 10px rgba(245,197,66,0.7); }
  .studio-time { font-size: 11px; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .studio-ticks { position: relative; height: 8px; margin: 4px 14px 0; }
  .studio-ticks i { position: absolute; top: 0; width: 1px; height: 5px; background: rgba(245,197,66,0.5); transform: translateX(-50%); }

  /* intro "Hello" + finale "Join" — ported from the original */
  .blackout { position: absolute; inset: 0; background: #05060a; opacity: 0; pointer-events: none; z-index: 4; transition: opacity 2.2s ease; }
  #stage.fading .blackout { opacity: 1; }
  .center-wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: auto; z-index: 6; }
  .begin-btn { appearance: none; border: 0; background: none; cursor: pointer; font: inherit; font-weight: 500; font-size: 12px;
    letter-spacing: 0.42em; text-transform: uppercase; color: #ede6d3; padding: 12px 18px 12px 24px; white-space: nowrap;
    text-shadow: 0 0 26px rgba(245,197,66,0.45), 0 2px 10px rgba(0,0,0,0.95);
    transition: color .4s, letter-spacing .5s, text-shadow .5s, opacity .9s; opacity: 0; animation: fadeUp 2.4s 0.6s ease forwards; }
  .begin-btn:hover { color: #fbf7ec; letter-spacing: 0.5em; text-shadow: 0 0 38px rgba(245,197,66,0.9), 0 2px 10px rgba(0,0,0,0.95); }
  .center-wrap.begun .begin-btn { opacity: 0; pointer-events: none; }
  /* JOIN — only the verb shows, centered. Click it and a field fades in just below (JOIN
     never moves). A valid address turns the verb full amber. On submit it powers off (CRT). */
  .join-form { position: relative; display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }   /* invisible field sits over "Hello" pre-finale — don't eat its clicks */
  .join-form.show { opacity: 1; pointer-events: auto; }
  /* the verb — centered, muted at rest, full colour once the address is valid. no borders. */
  .join-btn { appearance: none; border: 0; background: none; cursor: pointer; position: relative; isolation: isolate; font: inherit; font-weight: 500; font-size: 13px;
    letter-spacing: 0.36em; text-indent: 0.36em; text-transform: uppercase; color: #f5c542; padding: 10px 10px; white-space: nowrap;
    text-shadow: 0 0 20px rgba(245,197,66,0.5), 0 0 14px rgba(0,0,0,0.82), 0 2px 9px rgba(0,0,0,0.95);   /* full-amber CTA + dark halo for legibility over the build */
    transition: color .7s ease, letter-spacing .7s cubic-bezier(.16,1,.3,1), text-shadow .7s ease, opacity .5s ease; }
  .join-btn:hover { color: #ffd45a; letter-spacing: 0.42em; }
  .join-form.valid .join-btn { text-shadow: 0 0 26px rgba(245,197,66,0.72), 0 0 7px rgba(245,197,66,0.5), 0 0 14px rgba(0,0,0,0.8), 0 2px 9px rgba(0,0,0,0.95); }
  .join-form.valid .join-btn:hover { color: #ffd45a; letter-spacing: 0.42em; }
  /* the field — floats just ABOVE JOIN (absolute, so JOIN stays put). The prompt
     "what's your email?" types itself in fast, then settles as a dimmed resting placeholder;
     the field is focused (keyboard up on mobile) with our own fat amber caret blinking. */
  .join-field { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%);
    width: min(74vw, 300px); height: 34px; isolation: isolate; }
  .join-form input { position: absolute; inset: 0; width: 100%; height: 100%;
    background: transparent; border: 0; outline: 0; color: #fbf7ec; font: inherit; font-size: 14px; letter-spacing: 0.04em;
    text-align: center; caret-color: transparent; text-shadow: 0 0 12px rgba(0,0,0,0.8), 0 1px 6px rgba(0,0,0,0.92);   /* readable over the live build */
    opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .join-form input::placeholder { color: #8f846d; opacity: 1; transition: opacity .55s ease; }
  .join-form.qdim input::placeholder { opacity: 0.45; }                  /* settles to a resting, dimmed placeholder */
  .join-form.revealed input { opacity: 1; pointer-events: auto; }
  /* fog behind the interactive text so JOIN, the email field, and the confirmation stay legible
     over the live build (same feathered dark scrim as the teaser lines; fades/scales with each). */
  .teaser p::before, .reveal::before, .join-btn::before, .join-field::before, .join-ok::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: -1; pointer-events: none; filter: blur(9px); transition: opacity 1s ease;   /* soften the blobs into fog, no hard edge */
    background:                                              /* a few offset blobs -> irregular, fog-like */
      radial-gradient(54% 60% at 42% 40%, rgba(3,4,8,0.92) 0%, transparent 70%),
      radial-gradient(50% 66% at 61% 62%, rgba(3,4,8,0.88) 0%, transparent 72%),
      radial-gradient(66% 74% at 50% 50%, rgba(3,4,8,0.88) 0%, rgba(3,4,8,0.42) 48%, transparent 82%); }
  .join-btn::before { width: 250%; height: 320%; }
  .join-field::before { width: 128%; height: 320%; opacity: 0; transition: opacity .6s ease; }
  .join-form.revealed .join-field::before { opacity: 1; }   /* the field's fog appears with the field */
  .join-ok::before { width: 260%; height: 320%; }
  /* the fog is only needed over the live build — once the map fades to black at the finish,
     drop it so JOIN / the field / "On the list" sit clean on the dark. */
  #stage.fading .join-btn::before,
  #stage.fading .join-field::before,
  #stage.fading .join-ok::before { opacity: 0; }
  /* our caret: 2px, full amber, soft glow — appears once the question has typed + faded */
  .caret { position: absolute; left: 50%; top: 50%; width: 2px; height: 17px; border-radius: 1px;
    background: #f5c542; box-shadow: 0 0 9px rgba(245,197,66,0.7); pointer-events: none;
    opacity: 0; transform: translate(-50%, -50%); transition: transform .07s ease-out; }
  .join-form.ready .caret { animation: caretBlink 1.06s steps(1, end) infinite; }
  @keyframes caretBlink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  /* on submit: the JOIN panel powers off via the WebGL CRT overlay (#crtfx). Here we just
     dissolve the HTML content quickly so the shader's glowing collapse is the whole show. */
  .join-form.done { pointer-events: none; }
  .join-form.done input, .join-form.done .join-btn { opacity: 0; transition: opacity .18s ease; }
  .join-form.done .caret { animation: none; opacity: 0; }
  /* the CRT overlay: full-screen, additive (screen) so the shader's glow lights the scene */
  #crtfx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; mix-blend-mode: screen; }
  /* the confirmation simply fades in where the void vanished — no movement, just an eased opacity curve */
  .join-ok { color: #f5c542; font-size: 11px; font-weight: 500; letter-spacing: 0.34em; text-transform: uppercase;
    position: relative; isolation: isolate;
    opacity: 0; animation: joinFade 1.2s cubic-bezier(.33, 0, .2, 1) forwards; }
  @keyframes joinFade { to { opacity: 1; } }
  /* teaser credits — mysterious lines that surface from the murk during the build (blur->sharp,
     slow rise), Westworld-style, then clear before the JOIN finale */
  .teaser { position: absolute; left: 50%; top: 26vh; transform: translateX(-50%); width: min(88vw, 760px);
    pointer-events: none; z-index: 5; }
  /* same type as Hello/Join: uppercase, wide tracking, bone, weight 500, soft amber glow */
  .teaser p { position: absolute; left: 0; right: 0; top: 0; margin: 0; text-align: center; isolation: isolate;
    color: #ede6d3; font: inherit; font-weight: 500; font-size: 13px; letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
    line-height: 1.95; text-shadow: 0 0 26px rgba(245,197,66,0.45), 0 0 16px rgba(0,0,0,0.92), 0 0 6px rgba(0,0,0,0.98), 0 2px 10px rgba(0,0,0,0.98);
    opacity: 0; transform: scale(1); filter: blur(4px); }
  /* same fluid fog as the JOIN field (shared rule above); lives inside the <p>, so it fades +
     scales with the text. Sized here for a single wide line. */
  .teaser p::before { width: 92%; height: 520%; }
  /* IN: a punch ON the beat — stamps in from oversized, glow FLARES (like the grid lighting up), then settles. */
  .teaser p.on { opacity: 1; filter: blur(0); transform: scale(1);
    animation: teaserPunch .58s cubic-bezier(.2,.8,.3,1); }
  /* OUT: the SAME punch, mirrored — flares and blows back out, on its exit beat. */
  .teaser p.leaving { opacity: 0;
    animation: teaserPunchOut .5s cubic-bezier(.4,0,.7,1); }
  @keyframes teaserPunch {
    0%   { opacity: 0; transform: scale(1.14); filter: blur(8px); text-shadow: 0 0 22px rgba(245,197,66,0.35), 0 2px 10px rgba(0,0,0,0.95); }
    28%  { opacity: 1; text-shadow: 0 0 50px rgba(245,197,66,1.0), 0 0 16px rgba(255,250,236,0.65), 0 2px 10px rgba(0,0,0,0.95); }
    62%  { transform: scale(0.985); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); text-shadow: 0 0 26px rgba(245,197,66,0.45), 0 2px 10px rgba(0,0,0,0.95); }
  }
  @keyframes teaserPunchOut {
    0%   { opacity: 1; transform: scale(1); filter: blur(0); text-shadow: 0 0 26px rgba(245,197,66,0.45), 0 2px 10px rgba(0,0,0,0.95); }
    38%  { opacity: 1; transform: scale(0.985); filter: blur(0); }
    72%  { opacity: 1; transform: scale(1.05); filter: blur(2px); text-shadow: 0 0 50px rgba(245,197,66,1.0), 0 0 16px rgba(255,250,236,0.65), 0 2px 10px rgba(0,0,0,0.95); }
    100% { opacity: 0; transform: scale(1.14); filter: blur(8px); text-shadow: 0 0 22px rgba(245,197,66,0.35), 0 2px 10px rgba(0,0,0,0.95); }
  }
  /* finale reveal: the brand + the plain truth (what it actually is), surfacing as the fog
     clears, above JOIN. The mystery built the feeling; this tells them. */
  .reveal { position: absolute; left: 50%; top: 18vh; transform: translateX(-50%); width: min(90vw, 780px); isolation: isolate;
    text-align: center; pointer-events: none; z-index: 5; opacity: 0; filter: blur(4px);
    transition: opacity 1.6s ease, filter 1.6s ease; }
  .reveal.show { opacity: 1; filter: blur(0); }
  .reveal::before { width: 56%; height: 210%; }   /* same fluid fog behind the wordmark + icons */
  .reveal .wordmark { color: #f2ead6; font-weight: 600; text-transform: uppercase; letter-spacing: 0.34em; text-indent: 0.34em;
    font-size: clamp(26px, 5.2vw, 46px); text-shadow: 0 0 42px rgba(245,197,66,0.5), 0 2px 14px rgba(0,0,0,0.95); }
  .reveal .icons { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 12px 0 0; }
  .reveal .icons svg { width: 18px; height: 18px; fill: none; stroke: #d9d0ba; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; filter: drop-shadow(0 0 9px rgba(245,197,66,0.3)); }
  .reveal .reveal-line { margin: 18px 0 0; color: #cfc6b2; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.16em; font-size: clamp(11px, 1.45vw, 13px); line-height: 2.0;
    text-shadow: 0 0 22px rgba(245,197,66,0.28), 0 2px 10px rgba(0,0,0,0.9); }
  .sound { position: absolute; top: 22px; right: 24px; z-index: 7; appearance: none; border: 0; background: none; cursor: pointer;
    color: #9a8f78; width: 20px; height: 20px; padding: 0; display: grid; place-items: center; opacity: 0;
    animation: fadeIn 2s 2.8s ease forwards; transition: color .3s, opacity .3s; }
  .sound:hover { color: #ede6d3; opacity: 1; }
  .sound svg { width: 18px; height: 18px; display: block; }
  .sound .off-ico { display: none; }
  .sound.off .on-ico { display: none; }
  .sound.off .off-ico { display: block; }
  .sound.off { opacity: 0.35; }
  .hidden { display: none !important; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { to { opacity: 0.55; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>
    <audio id="track" crossorigin="anonymous"></audio>
    <div id="ui"></div>

    <div class="blackout"></div>
    <div class="teaser" aria-hidden="true">
      <p data-t0="18.95" data-t1="25.26">Everything we ever knew, in one place.</p>
      <p data-t0="28.42" data-t1="34.74">Anything. Anywhere. All done at once.</p>
      <p data-t0="37.9" data-t1="42.63">Yours. At last.</p>
    </div>
    <div class="reveal" aria-hidden="true">
      <div class="wordmark">Wingman</div>
      <div class="icons">
        <svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 6.4l1.3 1.3L7.8 5"/><path d="M4 12.4l1.3 1.3L7.8 11"/><path d="M4 18.4l1.3 1.3L7.8 17"/><path d="M10.5 6.2h9.5M10.5 12.2h9.5M10.5 18.2h9.5"/></svg>
        <svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 11h6M9 14.5h6M9 18h3.5"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><line x1="3.6" y1="12" x2="20.4" y2="12"/><ellipse cx="12" cy="12" rx="4" ry="8.4"/></svg>
      </div>
    </div>
    <button class="sound" id="sound" aria-label="Toggle sound" title="Toggle sound">
      <svg class="on-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="off-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
    </button>
    <div class="center-wrap" id="centerWrap">
      <form class="join-form" id="joinForm" autocomplete="off" novalidate>
        <div class="join-field">
          <input id="email" type="email" inputmode="email" aria-label="Email" required />
          <span class="caret" aria-hidden="true"></span>
        </div>
        <button class="join-btn" type="submit" id="joinBtn">Join</button>
      </form>
      <div class="join-ok hidden" id="hint"></div>
    </div>

    <button id="galleryBtn">&#9638; gallery</button>
    <canvas id="crtfx" aria-hidden="true"></canvas>
  </div>
  <script type="module">
    import { boot } from "./engine/boot.js";
    import { setupIntro } from "./engine/intro.js";
    import config from "./scenes/wingman-intro.js";
    const isDev = /[?&]dev\b/.test(location.search);   // all dev tools gated behind ?dev (clean for visitors)
    boot({
      canvas: document.getElementById("scene"),
      audio: document.getElementById("track"),
      panel: document.getElementById("ui"),
      config, dev: isDev,
    }).then(({ host }) => {
      const $ = id => document.getElementById(id);
      const api = setupIntro(host, { stage: $("stage"),
        joinForm: $("joinForm"), email: $("email"), joinBtn: $("joinBtn"), hint: $("hint"), sound: $("sound") });
      if (!isDev) { $("galleryBtn").remove(); return; }    // visitors: no gallery, no deep-links, no scrubber
      // ---- dev-only below (requires ?dev) ----
      $("galleryBtn").style.display = "block";   // hidden by default in CSS so it never flashes for visitors
      $("galleryBtn").addEventListener("click", () => host.toggleGallery());
      const m = location.search.match(/[?&]t=([\d.]+)/);   // deep-link to a time, e.g. ?dev&t=35
      if (m) { $("centerWrap").classList.add("begun"); host.seekImmediate(parseFloat(m[1])); }
      if (/[?&]join/.test(location.search)) {               // ?dev&join: finale, pre-filled, ready
        $("centerWrap").classList.add("begun"); host.seekImmediate(host.scene.duration - 1.5);
        requestAnimationFrame(() => api.prefillJoin());
      }
      if (/[?&]gallery/.test(location.search)) { $("centerWrap").classList.add("begun"); host.toggleGallery(); }
    }).catch(err => { document.body.innerHTML = "<pre style='color:#f88;padding:20px'>" + err.stack + "</pre>"; });
  </script>
</body>
</html>
